name: Test Suite

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  # ============================================================
  # Backend (FastAPI) — unit + integration tests
  # ============================================================
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: TaskFlow
          POSTGRES_PASSWORD: main123
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_PASS: main123
      PGHOST: localhost
      PYTHONPATH: /github/workspace/analytics
    defaults:
      run:
        working-directory: ./analytics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: analytics/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -U postgres; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres not ready after 30s"
          exit 1

      - name: Run backend tests
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: analytics/coverage.xml
          retention-days: 7

  # ============================================================
  # Frontend — lint + unit tests (Jest)
  # ============================================================
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run frontend tests
        run: npm test --if-present -- --coverage --passWithNoTests

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: front/coverage
          retention-days: 7

  # ============================================================
  # End-to-end integration (full stack via docker-compose)
  # ============================================================
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose config
        run: docker compose config -q

      - name: Build all services
        run: docker compose build --no-cache

      - name: Start stack
        run: docker compose up -d

      - name: Wait for database health
        run: |
          for i in {1..30}; do
            status=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "$(docker compose ps -q database)" 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              echo "Database healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Database never became healthy"
          docker compose ps -a
          docker compose logs database
          exit 1

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost/api/init/ >/dev/null; then
              echo "Backend ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend not ready after 30s"
          docker compose logs backendpy
          exit 1

      - name: Run API contract tests
        run: |
          # Test POST /add/
          ADD_RESPONSE=$(curl -s -X POST http://localhost/api/add/ \
            -H "Content-Type: application/json" \
            -d '{"user":"testUser","taskName":"TestTask","taskDesc":"Test description","dateStart":"2025-06-15","dateEnd":"2025-06-15","timeStart":"09:00","timeEnd":"10:00"}')
          echo "Add response: $ADD_RESPONSE"
          if ! echo "$ADD_RESPONSE" | grep -q "Task added successfully"; then
            echo "POST /add/ failed"
            exit 1
          fi

          # Test GET /find/
          FIND_RESPONSE=$(curl -s "http://localhost/api/find/?user=testUser&taskName=TestTask")
          echo "Find response: $FIND_RESPONSE"
          if ! echo "$FIND_RESPONSE" | grep -q "TestTask"; then
            echo "GET /find/ failed"
            exit 1
          fi

          # Test duplicate insert (should succeed - no unique constraint yet)
          ADD_RESPONSE2=$(curl -s -X POST http://localhost/api/add/ \
            -H "Content-Type: application/json" \
            -d '{"user":"testUser","taskName":"TestTask2","taskDesc":"Another","dateStart":"2025-06-16","dateEnd":"2025-06-16","timeStart":"11:00","timeEnd":"12:00"}')
          echo "Add response 2: $ADD_RESPONSE2"
          if ! echo "$ADD_RESPONSE2" | grep -q "Task added successfully"; then
            echo "Second POST /add/ failed"
            exit 1
          fi

          # Test list via find with wildcard-like query (current implementation)
          FIND_ALL=$(curl -s "http://localhost/api/find/?user=testUser&taskName=TestTask")
          echo "Find all response: $FIND_ALL"
          if ! echo "$FIND_ALL" | grep -q "TestTask"; then
            echo "Find all failed"
            exit 1
          fi

          echo "All API contract tests passed"

      - name: Test frontend serves correctly
        run: |
          FRONT_RESPONSE=$(curl -s http://localhost/)
          if ! echo "$FRONT_RESPONSE" | grep -q "Taskflow"; then
            echo "Frontend not serving correctly"
            echo "Response: $FRONT_RESPONSE"
            exit 1
          fi
          echo "Frontend serves index.html correctly"

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ============================================================
  # Security & quality gates
  # ============================================================
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: '--verbose --redact'

  # ============================================================
  # Summary / gate
  # ============================================================
  test-summary:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, security-scan]
    if: always()
    steps:
      - name: Check all test jobs passed
        run: |
          echo "Backend tests: ${{ needs.backend-tests.result }}"
          echo "Frontend tests: ${{ needs.frontend-tests.result }}"
          echo "E2E tests: ${{ needs.e2e-tests.result }}"
          echo "Security scan: ${{ needs.security-scan.result }}"
          
          if [[ "${{ needs.backend-tests.result }}" != "success" ]] ||
             [[ "${{ needs.frontend-tests.result }}" != "success" ]] ||
             [[ "${{ needs.e2e-tests.result }}" != "success" ]] ||
             [[ "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          
          echo "All test jobs passed!"