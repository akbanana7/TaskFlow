name: Docker Deploy Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout
       uses: actions/checkout@v5
      
     - name: Validate docker config
       run: docker compose config -q
    
     - name: Build docker
       run: docker compose build --no-cache

     - name: Run docker
       run: docker compose up -d

     - name: Wait for database health
       run: |
          for i in {1..30}; do
            status=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "$(docker compose ps -q database)" 2>/dev/null || true)

            if [ "$status" = "healthy" ]; then
              exit 0
            fi

            sleep 2
          done

          docker compose ps -a
          docker compose logs
          exit 1
     - name: Cleanup
       if: always()
       run: docker compose down -v
