services:
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.front.rule=PathPrefix(`/`)"
      - "traefik.http.routers.front.entrypoints=web"
      - "traefik.http.services.front.loadbalancer.server.port=8080"
    depends_on:
      - database

  backendpy:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    environment:
      DB_PASS: main123
      PGHOST: database
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backendpy.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backendpy.entrypoints=web"
      - "traefik.http.services.backendpy.loadbalancer.server.port=8000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18
    environment:
      POSTGRES_DB: "TaskFlow"
      POSTGRES_PASSWORD: main123
    volumes:
      - ./prod/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:3.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - 80:80
      - 127.0.0.1:8015:8080
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
